<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expenses</title>

<script src="/static/expenses.js" defer></script>
<script src="/static/export.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 font-sans">

<div class="flex min-h-screen">

  <!-- Sidebar -->
  <aside class="w-64 bg-white border-r border-gray-200 flex flex-col">
    <div class="flex items-center justify-between px-6 py-5 border-b border-gray-200">
      <div class="w-9 h-9 bg-gradient-to-br from-emerald-500 to-teal-500 rounded-xl flex items-center justify-center text-white font-bold text-lg shadow-md">D</div>
      <span class="text-gray-800 font-semibold tracking-tight">DyleeBoutique</span>
      <span class="absolute -bottom-1 left-0 w-0 h-0.5 bg-primary transition-all duration-300 group-hover:w-full"></span>
      <button id="collapseBtn"
      class="flex items-center justify-center w-8 h-8 rounded-full bg-gray-100 hover:bg-gray-200 transition text-gray-600 font-semibold">
      ←
      </button>
    </div>
    <nav class="p-4 space-y-2">
      <a href="dashboard.html" class="block p-2 rounded hover:bg-gray-100">Home</a>
      <a href="products.html" class="block p-2 rounded hover:bg-gray-100">Products</a>
      <a href="orders.html" class="block p-2 rounded hover:bg-gray-100">Orders</a>
      <a href="customers.html" class="block p-2 rounded hover:bg-gray-100">Customers</a>
      <a href="expenses.html" class="block p-2 rounded bg-gray-100 font-semibold">Expenses</a>
    </nav>
  </aside>

  <!-- Main -->
  <main class="flex-1 p-8 space-y-8">

    <h1 class="text-3xl font-bold mb-6">My Expenses</h1>

    <!-- CONTROL BAR -->
    <div class="flex flex-wrap items-center justify-between gap-4">

      <div class="flex gap-2">
        <button id="tableBtn" class="text-white bg-gradient-to-r from-blue-500 to-blue-700 hover:bg-gradient-to-br font-medium rounded-lg text-sm px-5 py-2.5 transition">
          Table
        </button>

        <button id="cardBtn" class="text-white bg-gradient-to-r from-purple-500 to-indigo-600 hover:bg-gradient-to-br font-medium rounded-lg text-sm px-5 py-2.5 transition">
          Cards
        </button>
      </div>

      <div class="flex gap-2">
        <a href="add_expense.html"
            class="text-white bg-gradient-to-r from-indigo-500 to-purple-600 hover:bg-gradient-to-br font-medium rounded-lg text-sm px-5 py-2.5 transition">
            + Add Expense
        </a>

        <button id="clearBtn"
        class="text-white bg-red-600 hover:bg-gradient-to-br font-medium rounded-lg text-sm px-5 py-2.5">

        Clear Table

        </button>

        <button id="downloadBtn" class="text-white bg-gradient-to-r from-blue-400 to-blue-600 hover:bg-gradient-to-br font-medium rounded-lg text-sm px-5 py-2.5 transition">
          Download JSON
        </button>

        <button id="exportExpenses"
            class="text-white bg-gradient-to-r from-green-400 to-green-600 hover:bg-gradient-to-br focus:ring-4 focus:ring-green-300 font-medium rounded-lg text-sm px-5 py-2.5 transition">
            Export PDF
        </button>

      </div>

    </div>

    <!-- TABLE VIEW -->
    <div id="tableDiv" class="bg-white rounded-xl shadow-lg overflow-hidden">
      <table class="w-full text-left">
        <thead id="expenseHead" class="bg-gray-50 text-gray-600 text-sm uppercase">
        </thead>
        <tbody id="expenseBody" class="text-gray-700 divide-y">
        </tbody>
      </table>
    </div>

    <!-- CARD VIEW -->
    <div id="cardDiv" class="hidden grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
    </div>

  </main>
</div>

</body>
</html>
