<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DyleeBoutique - Login</title>

<script src="/static/login.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="min-h-screen bg-gray-50 flex items-center justify-center">

<div class="absolute inset-0 bg-gradient-to-br from-blue-50 to-purple-50"></div>

<div class="relative w-full max-w-md bg-white shadow-xl rounded-2xl p-8">

<div class="text-center mb-8">

<h1 class="text-3xl font-bold text-gray-800">
DyleeBoutique
</h1>

<p class="text-gray-500 mt-2">
Manage your boutique orders easily
</p>

</div>

<form class="space-y-5">

<div>
<label class="block text-sm font-medium text-gray-600 mb-1">
Email
</label>
<input
id="userEmail"
name="email"
type="email"
placeholder="you@email.com"
class="w-full border border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-blue-500 focus:outline-none">
</div>

<div>
<label class="block text-sm font-medium text-gray-600 mb-1">
Password
</label>
<input
name="password"
type="password"
placeholder="••••••••"
class="w-full border border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-blue-500 focus:outline-none">
</div>

<div class="flex justify-between items-center text-sm">

<label class="flex items-center gap-2 text-gray-600">
<input type="checkbox" class="rounded">
Remember me
</label>

<a href="#" class="text-blue-600 hover:underline">
Forgot password?
</a>

</div>

<button
class="w-full bg-gradient-to-r from-blue-500 to-purple-600 text-white py-3 rounded-lg font-semibold hover:opacity-90 transition">

Sign In

</button>

</form>

<div class="text-center mt-6 text-sm text-gray-500">

Don't have an account?

<a href="signup.html" class="text-blue-600 hover:underline font-medium">
Create one
</a>

</div>

</div>

</body>
</html>
