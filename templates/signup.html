<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DyleeBoutique - Sign Up</title>

<script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="min-h-screen bg-gray-50 flex items-center justify-center">

<div class="absolute inset-0 bg-gradient-to-br from-purple-50 to-blue-50"></div>

<div class="relative w-full max-w-md bg-white shadow-xl rounded-2xl p-8">

<div class="text-center mb-8">

<h1 class="text-3xl font-bold text-gray-800">
Create Account
</h1>

<p class="text-gray-500 mt-2">
Start managing your boutique with DyleeBoutique
</p>

</div>

<form class="space-y-5">

<div>
<label class="block text-sm font-medium text-gray-600 mb-1">
Full Name
</label>

<input
name="name"
type="text"
placeholder="John Doe"
class="w-full border border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-purple-500 focus:outline-none">
</div>

<div>
<label class="block text-sm font-medium text-gray-600 mb-1">
Email
</label>

<input
name="email"
type="email"
placeholder="you@email.com"
class="w-full border border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-purple-500 focus:outline-none">
</div>

<div>
<label class="block text-sm font-medium text-gray-600 mb-1">
Password
</label>

<input
name="password"
type="password"
placeholder="Create password"
class="w-full border border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-purple-500 focus:outline-none">
</div>

<div>
<label class="block text-sm font-medium text-gray-600 mb-1">
Confirm Password
</label>

<input
type="password"
placeholder="Repeat password"
class="w-full border border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-purple-500 focus:outline-none">
</div>

<button
class="w-full bg-gradient-to-r from-purple-500 to-blue-600 text-white py-3 rounded-lg font-semibold hover:opacity-90 transition">

Create Account

</button>

</form>

<div class="text-center mt-6 text-sm text-gray-500">

Already have an account?

<a href="login.html" class="text-purple-600 hover:underline font-medium">
Login
</a>

</div>

</div>

</body>
</html>
